name: Deploy Vite app to GitHub Pages

on:
  push: { branches: [ "main" ] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Auto-detect package manager and build
      - name: Install deps & build
        run: |
          set -e
          if [ -f pnpm-lock.yaml ]; then corepack enable; pnpm i --frozen-lockfile; pnpm vite build;
          elif [ -f yarn.lock ]; then corepack enable; yarn install --frozen-lockfile; npx vite build;
          else npm ci || npm i; npx vite build; fi

      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.deployment.outputs.page_url }} }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
